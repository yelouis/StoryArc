name: story_arc
description: A premium, AI-first journaling application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  cloud_firestore: ^4.17.4
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.6
  firebase_analytics: ^10.10.7
  firebase_crashlytics: ^3.5.7
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  go_router: ^13.2.4
  path_provider: ^2.1.3
  intl: ^0.19.0
  emoji_picker_flutter: ^2.4.0
  record: ^5.1.0
  just_audio: ^0.9.38
  web_socket_channel: ^2.4.5
  uuid: ^4.4.0
  flutter_pcm_sound: ^1.0.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
